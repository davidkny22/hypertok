[package]
name = "hypertok-script-measurement-host"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
scalar = ["hypertok/scalar-pretokenizer"]
block-dispatch = ["hypertok/opt-block-dispatch"]

[dependencies]
hypertok = { path = "../../..", default-features = false, features = ["htk", "portable-json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
