[package]
name = "hypertok"
version = "0.10.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "hypertok"
crate-type = ["cdylib", "lib"]

[features]
default = ["portable-json", "wasm-binding"]
sentencepiece-core = []
sentencepiece = ["sentencepiece-core", "source-loaders", "dep:spm_precompiled"]
portable-json = ["dep:serde_json"]
source-loaders = ["portable-json", "dep:base64"]
wasm-binding = ["dep:wasm-bindgen"]
profiling = ["wasm-binding", "portable-json"]
profiling-sampling = ["profiling"]
decode-profile-api = ["wasm-binding", "htk"]
decode-profiling = ["decode-profile-api", "portable-json"]
decode-profiling-sampling = ["decode-profiling"]
cold-construction-profiling = ["wasm-binding", "htk", "portable-json"]
opt-decode-assembly = ["wasm-binding", "htk"]
opt-decode-borrowed-output = ["opt-decode-assembly", "dep:js-sys"]
opt-decode-direct-gather = ["opt-decode-assembly"]
opt-decode-utf16-output = ["opt-decode-assembly"]
opt-decode-boundary = ["opt-decode-assembly", "dep:js-sys"]
opt-marshalling = ["wasm-binding", "dep:js-sys"]
opt-encode-into = ["wasm-binding", "opt-marshalling", "dep:js-sys"]
opt-scratch-reuse = ["wasm-binding", "dep:js-sys"]
opt-chunk-prescan = ["wasm-binding", "htk"]
opt-scan-two-phase = ["wasm-binding"]
opt-level-select = ["wasm-binding", "opt-marshalling", "opt-scan-two-phase"]
opt-block-dispatch = ["wasm-binding"]
opt-relaxed-simd = ["wasm-binding"]
opt-resident-diet = ["wasm-binding"]
opt-cold-diet = ["wasm-binding"]
opt-fused-pair-ranks = ["opt-cold-diet"]
opt-compact-ranks = ["wasm-binding"]
opt-miss-path-diet = ["wasm-binding"]
opt-batch-locality = ["wasm-binding"]
threaded-wasm = ["dep:rayon", "wasm-binding", "htk", "dep:wasm-bindgen-rayon"]
htk = ["dep:hypertok-format", "dep:hypertok-hash"]
scalar-pretokenizer = []

[dependencies]
aho-corasick = "1.1"
base64 = { version = "0.22", optional = true }
eyre = "0.6.12"
hypertok-format = { path = "hypertok-format", optional = true }
hypertok-hash = { path = "hypertok-hash", optional = true }
js-sys = { version = "=0.3.102", optional = true }
memchr = "2.8.0"
rayon = { version = "1.11", optional = true }
rustc-hash = "2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", optional = true }
spm_precompiled = { version = "0.1.4", optional = true }
wasm-bindgen = { version = "=0.2.125", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "=1.3.0", optional = true }

[dev-dependencies]
fancy-regex = "0.18.0"
hypertok-converter = { path = "hypertok-converter" }
hypertok-hash = { path = "hypertok-hash", features = ["builder"] }
icu = { version = "2.2", features = ["compiled_data"] }
itertools = "0.15"
rand = "0.10"
sha2 = "0.10.9"

[[test]]
name = "htk_refusal"
path = "tests/refusal/src/main.rs"
harness = false
required-features = ["htk", "sentencepiece-core"]

[[test]]
name = "format_lookup_faults"
path = "tests/mutation-teeth/src/main.rs"
harness = false
required-features = ["htk", "source-loaders"]

[[example]]
name = "htk_parity"
required-features = ["htk", "source-loaders", "sentencepiece"]

[[example]]
name = "htk_reserved_policy"
required-features = ["htk"]

[[example]]
name = "verify_vocabulary_mapping"
path = "tests/bijection-round-trip/launch-verify/src/main.rs"
required-features = ["htk", "source-loaders"]

[[example]]
name = "verify_vocab_package"
path = "tests/bijection-round-trip/package-verify/src/main.rs"
required-features = ["htk", "sentencepiece"]

[profile.release]
lto = "fat"

[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hypertok_test_fault, values("byte-constructor", "sentencepiece-shape"))'] }
