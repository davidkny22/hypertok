[package]
name = "hypertok-hash"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
builder = ["dep:binout", "dep:ph"]

[dependencies]
wyhash = "=0.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
binout = { version = "=0.3.1", optional = true }
ph = { version = "=0.11.0", default-features = false, features = ["wyhash"], optional = true }

[workspace]
